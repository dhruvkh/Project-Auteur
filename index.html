  <!-- Twitter -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#F8F6F2',
            ink: '#1A1A1A',
            'ink-soft': '#333333',
            primary: '#FECF0A',
            'primary-dark': '#E9BB00',
            secondary: '#FFFFFF',
            'body-neutral': '#6b6866',
            'panel-muted': '#F0EEE9',
            'panel-dark': '#EAE8E3',
            'cursor-fill': 'rgba(254, 207, 10, 0.2)',
          },
          // FONT FAMILY UPDATED TO USE JOST AND PLAYFAIR DISPLAY
          fontFamily: {
            sans: ['Jost', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          backgroundImage: {
            'dramatic-header': 'linear-gradient(to bottom, #FECF0A, #E9BB00)',
            'halftone': "radial-gradient(circle, rgba(0,0,0,0.1) 1px, transparent 1px)",
            'halftone-yellow': "radial-gradient(circle, rgba(254, 207, 10, 0.5) 1px, transparent 1px)",
            'halftone-panel': "radial-gradient(circle, rgba(254, 207, 10, 0.2) 1px, transparent 1px)",
          },
          backgroundSize: {
            'halftone-size': '10px 10px',
          },
          animation: {
            'ticker': 'ticker 20s linear infinite',
            'reveal-staggered': 'reveal 1s ease-out forwards',
          },
          keyframes: {
            ticker: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-50%)' },
            },
            reveal: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
        }
      }
    }
  </script>
  <script type="importmap">
  {
    "imports": {

    }
  }
  </script>
